---
# Firewall rules for incoming traffic
ufw_rules:
  ssh:
    port: 22
    proto: tcp
    comment: Allow SSH
  # http:
  #   port: 80
  #   proto: tcp
  #   comment: Allow HTTP
  # https:
  #   port: 443
  #   proto: tcp
  #   comment: Allow HTTPS
  # dns:
  #   port: 53
  #   interface_in: wg0
  #   comment: Allow DNS from WireGuard clients

# Firewall rules for forwarded traffic
ufw_route_rules: {}
  # private_to_internet:
  #   interface_in: enp7s0
  #   interface_out: eth0
  #   comment: Allow enp7s0 to eth0

# Default policies for traffic not matched by any rule
ufw_default_policies:
  # CIS 4.1.3 Ensure ufw default deny firewall policy (incoming)
  incoming: deny
  outgoing: allow
  # CIS 4.1.5 Ensure ufw default deny firewall policy (routed)
  routed: deny

# UFW logging level
ufw_logging_level: medium
